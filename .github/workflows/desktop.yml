name: Desktop checks and test packages
on:
  push:
    branches: [tauri]
  pull_request:
    branches: [tauri]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: rustup show
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: pnpm audit
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - name: Build desktop package
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Collect macOS package
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Nalomu Note.app" "artifacts/Nalomu-Note-${{ matrix.target }}.zip"
          shasum -a 256 artifacts/*.zip > artifacts/SHA256SUMS.txt
      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe artifacts/
          Get-ChildItem artifacts/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: note-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  draft-release:
    name: Tag and draft test release
    needs: desktop
    if: github.ref == 'refs/heads/tauri' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: draft-release-${{ github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified packages
        run: gh run download "$GITHUB_RUN_ID" --pattern 'note-*' --dir artifacts
      - name: Prepare assets and release notes
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          tag = f"v{version}-test.{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_SHA'][:7]}"
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"RELEASE_TAG={tag}\n")
          out = pathlib.Path('release-assets')
          out.mkdir()
          packages = sorted(p for p in pathlib.Path('artifacts').rglob('*') if p.suffix in ('.zip', '.exe'))
          if len(packages) != 3:
              raise SystemExit(f'Expected 3 platform packages, got {len(packages)}')
          sums = []
          for package in packages:
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              expected = (package.parent / 'SHA256SUMS.txt').read_text().lower()
              if digest not in expected:
                  raise SystemExit(f'Checksum mismatch: {package}')
              shutil.copy2(package, out / package.name)
              sums.append(f'{digest}  {package.name}')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          pathlib.Path('release-notes.md').write_text(
              f"未签名测试包，提交 {os.environ['GITHUB_SHA']}。\n\n"
              "包含 macOS Apple Silicon、macOS Intel 的 .app ZIP 和 Windows x64 NSIS 安装包。"
              "请核对 SHA256SUMS.txt；macOS 解压后打开应用，Windows 运行安装包。\n\n"
              "本次 CI 类型检查、自动化测试、Rust 检查及依赖审计通过。"
              "Cargo 上游警告及缓解措施见 docs/security.md；原生验收边界见 docs/acceptance.md。"
              "构建通过不代表 Windows 原生验收通过。此版本保持草稿，不自动公开发布。\n"
          )
      - name: Tag tested commit and create draft
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent; then
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
          fi
          tagged_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tagged_sha" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt; then
            test "$(cat release-state.txt)" = true
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --latest=false --title "Nalomu Note $RELEASE_TAG" --notes-file release-notes.md
          fi
